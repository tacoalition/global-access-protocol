name: DCO

# Every commit in a PR is signed off by its author (`git commit -s`), certifying the Developer
# Certificate of Origin. See CONTRIBUTING.md, "Licensing and sign-off".
#
# The checker runs from the BASE branch, never from the PR: a PR that could edit the check could
# also pass it. The PR's commits are only read, through `git log`.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signoff:
    name: every commit is signed off (DCO)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: scripts/git
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # A bot cannot certify the DCO, and a maintainer reviews every Dependabot PR anyway. It is
      # exempted by the PR's opener, which GitHub sets, never by a commit's author email, which
      # anyone can write into a commit.
      - if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "opened by dependabot[bot], which cannot sign off, so it is exempt"
      - if: github.event.pull_request.user.login != 'dependabot[bot]'
        working-directory: pr
        run: node ../trusted/scripts/git/check-dco.mjs --range "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
