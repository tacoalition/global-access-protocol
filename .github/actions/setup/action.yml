name: setup
description: Node, pnpm, dependencies, and the pinned setup inputs — shared by every job.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 9.15.9
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
    # The phase-1 file is 72 MB and its digest is PINNED, so a cache hit is safe by construction:
    # fetch-ptau.sh re-verifies every copy it finds on disk, not only the ones it downloaded. Same
    # for the pinned compiler. Without this every job re-downloads 72 MB.
    #
    # Keyed on the scripts that hold the pins, not on a version typed here: a hand-written key
    # outlives a bumped pin, and then every run misses the cache and downloads in silence.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          powersOfTau28_hez_final_16.ptau
          ~/.cache/gap-circom
        key: gap-setup-${{ hashFiles('scripts/v2/lib/fetch-ptau.sh', 'scripts/v2/lib/fetch-circom.sh') }}
    # Exported from here rather than set in the workflow's `env`, where `~` is not expanded and the
    # build would create a directory literally named `~` and cache nothing.
    - shell: bash
      run: echo "GAP_CIRCOM_CACHE=$HOME/.cache/gap-circom" >> "$GITHUB_ENV"
    - shell: bash
      run: pnpm install --frozen-lockfile
