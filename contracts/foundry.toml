[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache_path = "cache"

# Solidity compiler settings
solc_version = "0.8.20"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false

# Test settings
verbosity = 2
ffi = false  # Nothing calls vm.ffi. Off, so a PR's tests cannot run shell commands through `forge test`
fs_permissions = [
    { access = "read-write", path = "./test/fixtures" },
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "../deployments" },
    { access = "read", path = "../test-data" },
    { access = "read", path = "./bytecode" },
    { access = "read", path = "./config" }
]

# Gas reporting
gas_reports = ["*"]

[profile.default.fuzz]
runs = 256

[profile.ci.fuzz]
runs = 10000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
sepolia = "${SEPOLIA_RPC_URL}"
